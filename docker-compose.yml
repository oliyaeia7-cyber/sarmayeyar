version: "3.9"
services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      - SITE_URL=http://localhost:8000
      - SECRET_KEY=dev-secret-change-me
      - DATABASE_URL=sqlite:////app/data/sarmayeyar.db
      - ADMIN_EMAIL=admin@sarmayeyar.local
      - ADMIN_PASSWORD=ChangeMe123!
    volumes:
      - sarmayeyar_data:/app/data
    restart: unless-stopped

volumes:
  sarmayeyar_data:
