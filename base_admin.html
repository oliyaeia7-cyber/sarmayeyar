<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ meta.title }}</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="brand"><span class="mark"></span> سرمایه‌یار</div>
    <a href="/admin" class="{{ 'active' if page_key=='dashboard' else '' }}">📊 داشبورد</a>
    <a href="/admin/users" class="{{ 'active' if page_key=='users' else '' }}">👤 کاربران</a>
    <a href="/admin/assets" class="{{ 'active' if page_key=='assets' else '' }}">💰 دارایی‌ها</a>
    <a href="/admin/blog" class="{{ 'active' if page_key=='blog' else '' }}">📝 وبلاگ</a>
    <a href="/admin/messages" class="{{ 'active' if page_key=='messages' else '' }}">✉️ پیام‌ها</a>
    <a href="/admin/settings" class="{{ 'active' if page_key=='settings' else '' }}">⚙️ تنظیمات</a>
    <a href="/" target="_blank">🌐 مشاهده سایت</a>
    <a href="/admin/logout">🚪 خروج</a>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <h2 style="margin:0;">{{ page_title }}</h2>
      <span style="color:var(--muted);font-size:.85rem;">{{ admin.full_name }}</span>
    </div>
    {% block admin_content %}{% endblock %}
  </main>
</div>
</body>
</html>
