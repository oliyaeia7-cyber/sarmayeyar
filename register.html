{% extends "base.html" %}
{% block content %}
<section class="section" style="padding-top:70px;">
  <div class="container">
    <div class="form-card">
      <h2 style="text-align:center;margin-bottom:22px;">ثبت‌نام رایگان</h2>
      {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
      <form method="post" action="/register">
        <div class="form-group"><label>نام و نام خانوادگی</label><input type="text" name="full_name" required></div>
        <div class="form-group"><label>ایمیل</label><input type="email" name="email" required></div>
        <div class="form-group"><label>رمز عبور</label><input type="password" name="password" minlength="6" required></div>
        <button class="btn btn-brass btn-block" type="submit">ساخت حساب کاربری</button>
      </form>
      <p style="text-align:center;margin-top:16px;font-size:.88rem;">قبلاً ثبت‌نام کرده‌اید؟ <a href="/login" style="color:var(--brass-bright);">وارد شوید</a></p>
    </div>
  </div>
</section>
{% endblock %}
