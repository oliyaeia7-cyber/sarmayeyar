{% extends "base.html" %}
{% block content %}
<section class="section" style="padding-top:60px;">
  <div class="container">
    <div class="section-head" style="margin:0 auto 40px;text-align:center;">
      <span class="eyebrow" style="margin:0 auto;">تماس با ما</span>
      <h2>سوال یا پیشنهادی دارید؟</h2>
    </div>
    <div class="form-card">
      {% if sent %}
        <div class="alert alert-success">پیام شما با موفقیت ارسال شد. به‌زودی پاسخ داده می‌شود.</div>
      {% endif %}
      <form method="post" action="/contact">
        <div class="form-group"><label>نام</label><input type="text" name="name" required></div>
        <div class="form-group"><label>ایمیل</label><input type="email" name="email" required></div>
        <div class="form-group"><label>پیام</label><textarea name="message" required></textarea></div>
        <button class="btn btn-brass btn-block" type="submit">ارسال پیام</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
